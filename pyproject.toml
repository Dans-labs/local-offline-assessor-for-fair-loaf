[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[project]
name = "fair-offline-assessor"
version = "0.1.0"
description = "Offline FAIR assessment using versioned metric profiles"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0 AND CC-BY-SA-3.0 AND CC-BY-4.0 AND LicenseRef-W3C-2023 AND MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt"]
authors = [
    { name = "Data Archiving and Networked Services (DANS)" },
    { name = "Laurens Tobias", email = "laurens.tobias@dans.knaw.nl" },
]
keywords = ["FAIR", "metadata", "JSON-LD", "research data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "hashid~=3.1.4",
    "idutils~=1.2",
    "levenshtein>=0.27,<0.28",
    "packaging>=25",
    "pydantic>=2.12,<3",
    "PyLD>=3.3,<4",
    "PyYAML>=6",
    "rapidfuzz>=3,<4",
    "six>=1.17",
    "tldextract==5.3.2",  # Pin the suffix list used for namespace matching.
]

[dependency-groups]
dev = [
    "lxml>=6",
    "mypy>=1.15",
    "pytest>=8",
    "pytest-socket>=0.7",
    "ruff>=0.12",
    "types-PyYAML>=6",
]
release = [
    "twine>=6",
    "cffconvert>=2",
]

[tool.uv.build-backend]
source-include = ["scripts/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket"

[tool.ruff]
target-version = "py312"
# Preserve copied upstream code; maintained integration code remains checked.
extend-exclude = ["src/fair_offline_assessor/_vendor/fuji/v3_5_1"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Ruff formatter conflicts.
    "COM812", "COM819", "D203", "D206", "D300",
    "E111", "E114", "E117", "Q000", "Q001", "Q002", "Q003", "Q004", "W191",
    "D213",  # Use first-line docstring summaries (D212).
    "D100", "D101", "D104", "D106",  # Require docstrings on functions and methods.
    "CPY001",  # Attribution lives in LICENSE and NOTICE.
    "EM101", "EM102", "TRY003",  # Keep validation messages inline.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D1", "INP001", "PLR2004", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["fair_offline_assessor._vendor.fuji.v3_5_1.*"]
ignore_errors = true
